name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle offline wake-word model (Vosk small en-IN, Apache-2.0)
        continue-on-error: true
        run: |
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-in
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
          du -sh app/src/main/assets/model-en-in

      - name: Unit tests
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee ci-logs/unit-tests.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee ci-logs/assemble.log

      - name: Lint (report only)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug 2>&1 | tail -40 | tee ci-logs/lint.log

      - name: APK info
        run: |
          ls -la app/build/outputs/apk/debug/ | tee ci-logs/apk-info.txt
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk | head -25 | tee -a ci-logs/apk-info.txt
          $BT/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | head -12 | tee -a ci-logs/apk-info.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "model-en-in/(am|conf|graph)/" | head -8 | tee -a ci-logs/apk-info.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee -a ci-logs/apk-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HiSinchan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Publish logs + APK to build-output branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cp -r ci-logs /tmp/out/ 2>/dev/null || true
          cp -r app/build/test-results /tmp/out/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.txt /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/HiSinchan-debug.apk 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "CI output for ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-output

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bundle wake-word model
        continue-on-error: true
        run: |
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip && mkdir -p app/src/main/assets && mv vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
      - name: Build emulator APK (adds x86_64)
        run: ./gradlew --no-daemon assembleDebug -Pemulator
      - name: Run on tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/emulator-test.sh 2>&1 | tee emu-test.log
      - name: Publish emulator results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/emu && cp -r emu-out/* /tmp/emu/ 2>/dev/null || true
          cp emu-test.log /tmp/emu/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/emu/STATUS
          cd /tmp/emu && git init -q -b emulator-output
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Emulator results for ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" emulator-output
